<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .out{
            background-color: aqua;
            height:400px ;
            width: 400px;
            animation-name: sun;
            animation-duration: 2s;
            animation-iteration-count: infinite;
        }
        .outer
        {
            height:400px ;
            width: 400px;
            border: 2px dashed purple;
            border-radius: 50%;
            margin: 20px;
        }
        @keyframes sun {
            0%
            {
                transform: rotate(0deg);
            }
            100%
            {
                transform:  rotate(360deg);
            }
        }
        .inner
        {
            height:300px ;
            width: 300px;
            background-color: plum;
            border: 2px rgb(9, 2, 9);
            border-radius: 50%;
            margin: 30px;
            padding: 20px;
        }
        img{
            height:300px ;
            width: 300px;
            border-radius: 50%;
            margin: 0px;
            padding: 0px;
        }
    </style>
</head>
<body>
    <div class="out">
    <div class="outer">
        <div class="inner"><img src="my picture.jpeg" ></div>
    </div>
    </div>

</body>
</html>
