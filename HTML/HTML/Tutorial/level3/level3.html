<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>level 3</title>
</head>
<body>
    <!--PAGE LAYOUT TECHNIQUES-->
    <!--using semantic tags for layout-->
    <!--using the right tags -->
    <header>
            <h3>My Portfolio</h3>
    </header>
    <main>
     <!--INSIDE MAI TAG-->
     <!--Section tag(for a section on your page)-->
     <section>Education : BGIEM(College)| SVPHSS(School)</section>
     <section>Experience : Actively learing programming fundamaentals and problem-solving.</section>
     <!--Article tag(for an article on your page)-->
     <article>My First Project!</article>
     <!--Aside tag(for content aside main content(ads))-->
     <aside>This is an Ad..</aside>
         <!-- DIV TAG (it is a container used for other HTML elements/ BLOCK ELEMENTS {takes full width})-->
    <div>
        <p>Hello word</p>
        <p>Welcome to HTML</p>
    </div>
    <!--SPAN TAG (it is also a container used for other HTML elements/ INLINE ELEMENTS{take width as per size} )-->
    <span>I'm working on HTML.</span>
    </main>
    <footer>
        <h4>Hello.. Meet me at office!</h4>
    </footer>
    <!--Revisiting Anchor Tag -->
    <!--If we want our page to open in another tab we can used "target" tag  -->
    <a href="link"target="_main">name</a>                      <!-- FOR NEW TAB-->
    <!--Similarly if we want clickable picture to add in our webd=site or apge we can also do that-->
    <a href="link"><img src="link"></a>                              <!-- FOR CLICKABLE PICTURE-->
    <!--Revisiting Image Tag -->
    <!-- As in image tag if we want to set the height and width of our image we can set them as according to our preference and need by using above tags for height and width-->
    <img src="link"height=50px>                                   <!--set height  -->
    <img src="link"width=50px>                                    <!--set width -->

</body>
</html>
