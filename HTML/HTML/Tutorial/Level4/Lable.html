<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lable</title>
</head>
<body>
    <form>
    <!--LABLE (lable means assing a tag or name to any input)-->
    <label for="101">
        <input type="radio" value="Class XI" name="Class" id="101">Class XI
    </label>
    <br><br>
    <label for="102">
        <input type="radio" value="Class XII" name="Class" id="102">Class XII
    </label>
    <!--CLASS & ID-->
    <div id="D1" class="Group 1">

    </div>
    <div id="D2" class="Group 2">

    </div>
    <br><br>
    <label for="id1">
        <input type="checkbox" value="class X" name="class" id="id1">class X
    </label>
    <label for="id2">
        <input type="checkbox" value="class X" name="class" id="id2">class X
    </label>
    </form>
</body>
</html>
