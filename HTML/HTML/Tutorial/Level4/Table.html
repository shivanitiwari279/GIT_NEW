<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
     <!--TABLES IN HTML (tables are used to represent real life list data)-->
     <!--There are basically three types of tables: 1.tr (used to display table row) 2. tb(used to display table data) 
     3. th(used to display table header)-->
    <table>
        <caption>Student data</caption>
        <thead>
        <tr>
        <!--<th>Serial No.</th>
            <th>Name</th>
            <th>Roll No.</th> --> 
            <th colspan="3">
                INFORMATION
            </th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>1.</td>
            <td>Pooja </td>
            <td>2230</td>
        </tr>
        <tr>
            <td>2.</td>
            <td>Shalu </td>
            <td>2238</td>
        </tr>
        </tbody>
    </table>
    <!-- THEAD AND TBODY IN TABLE-->
    <!-- <thead> are used to wrap data head-->
    <!-- <tbody> are used to wrap data body-->
    <!-- When we need to merge two columns we used a tag viz "colspan" with "th" as we a merging headings so we'll use 
          <th colspan="(here we mention the no. of rows we need to merge )">-->
</body>
</html>
