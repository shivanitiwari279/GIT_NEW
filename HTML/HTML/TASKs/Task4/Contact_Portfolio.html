<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
</head>
<body>
    <header><h2>Contact Me</h2></header>
    <br>
    <p>The purpose of this page is to inform visitors how they can contact me.</p>
    <br>
    <hr>
    <main>
    <form action="/action.php">
    <label for="name">Name:</label>
    <input type="text" placeholder="Enter Your Name" id="name">
    <br><br>
    <label for="email">Email:</label>
    <input type="email" placeholder="Enter Your Email address" id="email">
    <br><br>
    <label for="Phone">Phone number:</label>
    <input type="number" placeholder="Enter Your Phone number" id="Phone">
    <br><br>
    <label for="message">Message:</label>
    <br>
    <textarea id="message" placeholder="Write Your message" rows="5" cols="30"></textarea>
    <br><br>
    <input type="submit" value="submit">
    <br><br>
    </form>
    </main>

</html>
