<!-- Create a button and set it's background color to:
 1.green using CSS stylesheet. 2.blue using <style> tag. 3.pink using <inline> style-->

 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setting color of button</title>
    <link rel="stylesheet" href="Style1.css">
    <style>
        button
        {
           background-color: blue;
        }
    </style>
 </head>
 <body>
       <button style="background-color: pink;">Click here for more information.</button> 
 </body>
 </html>
