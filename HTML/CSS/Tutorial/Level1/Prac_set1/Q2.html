<!-- Create 3 headings with h1, h2 & h3.Give them all a class "heading" & set color of "heading" to red -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class heading</title>
    <link rel="stylesheet" href="Style1.css">
</head>
<body>
    <h1 class="heading">Secrets I've held in my heart..</h1>
    <h2 class="heading">Are harder to hide than I thought!</h2>
    <h3 class="heading">Maybe I just wanna be yours, I wanna be yours....</h3>
</body>
</html>
